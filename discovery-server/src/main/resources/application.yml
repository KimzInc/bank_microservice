server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # This IS the registry, so it doesn't need to register with itself or fetch a registry
    register-with-eureka: false
    fetch-registry: false
  server:
    # Fine for local dev with a single registry instance; disables self-preservation warnings
    enable-self-preservation: false
