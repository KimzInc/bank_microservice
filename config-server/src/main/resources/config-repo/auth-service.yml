  expiration-ms: 3600000

# Seeds a default admin account on startup if one doesn't already exist - see
# AdminSeeder. Solves the bootstrapping problem: someone has to be ROLE_ADMIN
# before employee-service can onboard anyone else into a role. Change the
# password before this ever runs against anything but your own machine.
app:
  admin:
    username: admin
    password: Mypassword@1
    email: admin@bankapp.local