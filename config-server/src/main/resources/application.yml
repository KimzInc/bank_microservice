server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          # Serving config files bundled on the classpath under /config-repo.
          # Swap this for a git: URI once you want the "real" Git-backed config server.
          search-locations: classpath:/config-repo/
  profiles:
    active: native

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
